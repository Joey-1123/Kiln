name: Docs

on:
  push:
    branches: [master, main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy site to GitHub Pages (requires Pages enabled + supported plan)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv pip install -e ".[docs]"
      - run: mkdocs build --strict --site-dir site

      - name: Upload artifact
        # Only produce the deploy artifact when a deploy is actually requested;
        # otherwise the mkdocs build above is a pure doc lint (green on every push).
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Only deploy when explicitly requested via manual dispatch.
    # The current repo plan does not support GitHub Pages for a private repo,
    # so an automatic deploy on push always fails with 422. Gating it behind
    # the dispatch input keeps the push path green; re-run with `deploy: true`
    # once Pages is enabled and the plan supports it.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
